name: Deploy PWA

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "tests/local_backend.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Test PWA
        run: |
          npm ci
          npm test
          node --check static/app.js
          node --check static/local-backend.js
          node --check static/sw.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
